<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我们 | 上海伏曦量子科技有限公司</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <img src="assets/logo.png" alt="Foresight Quantum" class="nav-logo">
      <div class="nav-title">
        伏曦量子
        <span>FORESIGHT QUANTUM</span>
      </div>
    </a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="about.html">关于我们</a>
      <a href="products.html">产品与服务</a>
      <a href="news.html">新闻动态</a>
      <a href="contact.html" class="active">联系我们</a>
    </div>
    <button class="menu-toggle" aria-label="菜单">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Page Hero -->
  <div class="page-hero">
    <h1>联系我们</h1>
    <p class="en-title">Contact Us</p>
  </div>

  <!-- Contact Content -->
  <section class="section">
    <div class="contact-wrapper fade-in">
      <form class="contact-form" onsubmit="event.preventDefault(); alert('感谢您的留言，我们将尽快与您联系！');">
        <div class="form-group">
          <label for="name">您的姓名</label>
          <input type="text" id="name" placeholder="请输入姓名" required>
        </div>
        <div class="form-group">
          <label for="email">电子邮箱</label>
          <input type="email" id="email" placeholder="请输入邮箱" required>
        </div>
        <div class="form-group">
          <label for="subject">主题</label>
          <input type="text" id="subject" placeholder="请输入主题">
        </div>
        <div class="form-group">
          <label for="message">留言内容</label>
          <textarea id="message" placeholder="请输入您想咨询的内容" required></textarea>
        </div>
        <button type="submit" class="btn-submit">提交留言</button>
      </form>

      <div class="contact-info">
        <h3>联系方式</h3>
        <div class="info-item">
          <div class="info-icon">📍</div>
          <div class="info-text">
            <h4>公司地址</h4>
            <p>上海市浦东新区量子科技园</p>
          </div>
        </div>
        <div class="info-item">
          <div class="info-icon">📧</div>
          <div class="info-text">
            <h4>电子邮箱</h4>
            <p>contact@foresight-quantum.com</p>
          </div>
        </div>
        <div class="info-item">
          <div class="info-icon">📞</div>
          <div class="info-text">
            <h4>联系电话</h4>
            <p>+86 21-XXXX-XXXX</p>
          </div>
        </div>
        <div class="info-item">
          <div class="info-icon">🕐</div>
          <div class="info-text">
            <h4>工作时间</h4>
            <p>周一至周五 9:00 - 18:00</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 上海伏曦量子科技有限公司 Foresight Quantum. All rights reserved.</p>
    <div class="footer-links">
      <a href="about.html">关于我们</a>
      <a href="products.html">产品与服务</a>
      <a href="contact.html">联系我们</a>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
